name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run build
        env:
          VITE_API_ORIGIN: https://larek-api.nomoreparties.co

      - name: Check built files
        run: |
          echo "Проверка собранных файлов:"
          ls -la dist/
          echo "Проверка index.html:"
          head -50 dist/index.html
          echo "Проверка скриптов в index.html:"
          grep -o '<script[^>]*>' dist/index.html || echo "Скрипты не найдены"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
